<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Biblioteca ISTY</title>
<meta name="description" content="Biblioteca del Instituto Superior Tecnológico CIC-Yasuní: catálogo de libros organizado por carreras vigentes, con inicio de sesión y préstamos." />
<meta name="theme-color" content="#1a4d22" />
<link rel="icon" href="assets/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- Pantalla de acceso: inicio de sesión o creación del primer administrador -->
<section id="screen-auth" class="auth" hidden>
  <div class="auth-card">
    <img class="auth-logo" src="assets/logo.jpg" alt="Logo del Instituto Superior Tecnológico CIC-Yasuní" />
    <h1>Biblioteca Institucional</h1>
    <p class="tagline">Educación para el mañana</p>

    <form id="login-form" class="form" hidden>
      <label>Usuario
        <input id="login-user" type="text" autocomplete="username" autocapitalize="off" required maxlength="40" />
      </label>
      <label>Contraseña
        <span class="pw-row">
          <input id="login-pass" type="password" autocomplete="current-password" required maxlength="60" />
          <button type="button" class="btn btn-ghost btn-sm" data-toggle-pw="login-pass" aria-label="Mostrar u ocultar contraseña"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </span>
      </label>
      <p id="login-msg" class="form-msg" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit" data-icon="ingresar">Ingresar</button>
    </form>

    <form id="setup-form" class="form" hidden>
      <p class="hint">Primera vez: crea la cuenta del <strong>administrador</strong> de la biblioteca.</p>
      <label>Nombre completo
        <input id="setup-name" type="text" required maxlength="80" />
      </label>
      <label>Usuario
        <input id="setup-user" type="text" autocomplete="username" autocapitalize="off" required maxlength="40" pattern="[a-z0-9._\-]{3,40}" title="3 a 40 caracteres: minúsculas, números, punto, guion" />
      </label>
      <label>Contraseña (mínimo 6 caracteres)
        <input id="setup-pass" type="password" autocomplete="new-password" required minlength="6" maxlength="60" />
      </label>
      <label class="check"><input id="setup-demo" type="checkbox" checked /> Crear también cuentas de prueba: <code>estudiante</code>, <code>docente</code> y <code>administrativo</code> (contraseña <code>isty2026</code>)</label>
      <p id="setup-msg" class="form-msg" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Crear administrador</button>
    </form>
  </div>
  <p class="auth-foot">Instituto Superior Tecnológico CIC-Yasuní</p>
</section>

<!-- Aplicación -->
<div id="screen-app" hidden>
  <header class="topbar">
    <a href="#/" class="brand">
      <img src="assets/logo.jpg" alt="" />
      <span><strong>Biblioteca ISTY</strong><small>CIC-Yasuní</small></span>
    </a>
    <nav class="nav" aria-label="Secciones">
      <a href="#/" data-nav="catalogo" data-icon="catalogo">Catálogo</a>
      <a href="#/prestamos" data-nav="prestamos" data-icon="marcador">Mis préstamos</a>
      <a href="#/admin" data-nav="admin" id="nav-admin" data-icon="admin" hidden>Administración</a>
    </nav>
    <div class="user-box">
      <span id="user-name" class="user-name"></span>
      <button id="logout-btn" class="btn btn-light btn-sm" data-icon="salir">Salir</button>
    </div>
  </header>
  <div class="ring-bar" aria-hidden="true"></div>
  <main id="view" tabindex="-1"></main>
  <footer class="footer">Instituto Superior Tecnológico CIC-Yasuní · <em>Educación para el mañana</em></footer>
</div>

<!-- Ventana modal reutilizable -->
<dialog id="modal">
  <div id="modal-body"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
